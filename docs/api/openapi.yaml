openapi: 3.0.3
info:
  title: NirikshAI Regulatory Decision Support API
  version: 2.0.0
  description: Official OpenAPI 3.0 specification for the AICTE NirikshAI compliance platform.
servers:
  - url: https://sih-2k26-2-0.vercel.app/api
    description: Production Cloud Deployment
  - url: http://localhost:3000/api
    description: Local Development Environment
paths:
  /health:
    get:
      summary: System Health & Uptime Probe
      responses:
        '200':
          description: Healthy status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
                  version:
                    type: string
                    example: "2.0.0"
  /rules/evaluate:
    post:
      summary: Evaluate APH Rules Against Application Dossier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [application_id, category]
              properties:
                application_id:
                  type: string
                  example: "APP-2026-001"
                category:
                  type: string
                  example: "EOA_EXISTING"
      responses:
        '200':
          description: List of regulatory findings
          content:
            application/json:
              schema:
                type: object
                properties:
                  findings:
                    type: array
                    items:
                      type: object
                      properties:
                        rule_id:
                          type: string
                        kind:
                          type: string
                        severity:
                          type: string
                        clause:
                          type: string
  /audit/events:
    get:
      summary: Retrieve Cryptographically Sealed Audit Chain
      responses:
        '200':
          description: Audit ledger events with SHA-256 digests
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    prev_hash:
                      type: string
                    hash:
                      type: string
                    actor:
                      type: string
                    action:
                      type: string
                    at:
                      type: string
