# infra/k8s/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: nirikshai-web-service
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 3000
  selector:
    app: nirikshai
    tier: web
---
apiVersion: v1
kind: Service
metadata:
  name: nirikshai-ai-service
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: nirikshai
    tier: ai-service
